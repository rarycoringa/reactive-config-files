# Order application properties - Orchestration profile

spring:
    cloud:
        function:
            definition: sinkEvent;supplyOrderCommand;supplyProductCommand;supplyPaymentCommand;supplyShippingCommand;processOrderCommand
        stream:
            bindings:
                sinkEvent-in-0:
                    destination: saga_events
                    group: saga-events-group

                supplyOrderCommand-out-0:
                    destination: order_commands

                supplyProductCommand-out-0:
                    destination: product_commands

                supplyPaymentCommand-out-0:
                    destination: payment_commands

                supplyShippingCommand-out-0:
                    destination: shipping_commands

                processOrderCommand-in-0:
                    destination: order_commands
                    group: order-commands-group

                processOrderCommand-out-0:
                    destination: saga_events
            