# Order application properties - Orchestration profile

spring:
    cloud:
        function:
            definition: processOrderCommand;sinkEvent;testProducer;testConsumer
        stream:
            dynamicDestinations: order_commands,product_commands,payment_commands,shipping_commands
            bindings:
                processOrderCommand-in-0:
                    destination: order_commands
                    group: order-commands-group
                    content-type: application/json

                processOrderCommand-out-0:
                    destination: saga_events
                    content-type: application/json

                sinkEvent-in-0:
                    destination: saga_events
                    group: saga-events-group
                    content-type: application/json
            
                testProducer-out-0:
                    destination: test-topic
                testConsumer-in-0:
                    destination: test-topic
                    group: test-group